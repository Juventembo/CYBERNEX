name: Build CYBERNEX ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'auto/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Build inside Debian 13 (Trixie) so we get Debian's modern live-build.
    # The Ubuntu 24.04 runner ships live-build 3.0~a57, an ancient Ubuntu fork
    # that cannot build Trixie images (it fails at lb_binary_syslinux).
    # --privileged is required so debootstrap/live-build can mount /proc, /dev etc.
    container:
      image: debian:trixie
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools ca-certificates git \
            dosfstools mtools isolinux syslinux-common syslinux-utils \
            grub-pc-bin grub-efi-amd64-bin grub-efi-ia32-bin
          lb --version
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate source scripts
        run: |
          bash -n scripts/build-iso.sh
          sh -n auto/config
          test -s config/package-lists/cybernex.list.chroot
      - name: Build ISO
        run: bash scripts/build-iso.sh
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cybernex-iso
          path: |
            build/*.iso
            build/*.iso.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernex-build-log
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 14
