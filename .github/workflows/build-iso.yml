name: Build CYBERNEX ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'auto/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux syslinux-common
          echo "Checking BIOS bootloader files..."
          ls -l /usr/lib/ISOLINUX/isolinux.bin
          find /usr/lib/syslinux -name vesamenu.c32

      - name: Fix Live Build Contents index path
        run: |
          sudo sed -i \
            's|/dists/${LB_PARENT_DISTRIBUTION}/Contents-|/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-|g; s|/dists/${LB_DISTRIBUTION}/Contents-|/dists/${LB_DISTRIBUTION}/main/Contents-|g' \
            /usr/lib/live/build/lb_chroot_linux-image
          grep -n 'Contents-' /usr/lib/live/build/lb_chroot_linux-image

      - name: Validate source
        run: |
          bash -n scripts/build-iso.sh
          sh -n auto/config
          test -s config/package-lists/cybernex.list.chroot

      - name: Inspect Syslinux build scripts
        run: |
          echo "=== Live Build Syslinux script ==="
          sed -n '1,240p' /usr/lib/live/build/lb_binary_syslinux
          echo "=== Bootloader files ==="
          ls -l /usr/share/live/build/bootloaders/isolinux/
          ls -l /usr/lib/ISOLINUX/
          ls -l /usr/lib/syslinux/modules/bios/
          echo "=== Package versions ==="
          dpkg-query -W live-build isolinux syslinux-common

      - name: Build ISO
        run: sudo ./scripts/build-iso.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: cybernex-iso
          path: |
            build/*.iso
            build/*.sha256
          if-no-files-found: error
          retention-days: 7
